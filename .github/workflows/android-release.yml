name: Android Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK not found at $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1dc9" > "$SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646161cecb164bde4606c4" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: false
          link-to-sdk: true

      - name: Export NDK path
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Read app version
        id: app_version
        run: |
          VERSION_NAME=$(./gradlew -q :app:printVersionName --console=plain | tail -n 1 | tr -d '\r')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Rename APKs with version
        run: |
          mkdir -p app/build/outputs/apk/release
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "OpenTouch-*" | head -n 1)
          if [ -z "$DEBUG_APK" ]; then
            echo "Debug APK not found"
            find app/build/outputs -name "*.apk" -o -name "*.aab" | sort
            exit 1
          fi
          cp "$DEBUG_APK" "app/build/outputs/apk/release/OpenTouch-v${{ steps.app_version.outputs.version_name }}-debug.apk"
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "app/build/outputs/apk/release/OpenTouch-v${{ steps.app_version.outputs.version_name }}.apk"
            cp "$RELEASE_APK" "app/build/outputs/apk/release/OpenTouch-latest.apk"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/OpenTouch-v*.apk
            app/build/outputs/apk/release/OpenTouch-latest.apk
          generate_release_notes: true
