name: Android Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake 3.10.2
        run: sdkmanager --install "cmake;3.10.2.4988404"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Read app version
        id: app_version
        run: |
          VERSION_NAME=$(./gradlew -q :app:printVersionName --console=plain | tail -n 1 | tr -d '\r')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Rename APK with version
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          VERSIONED_APK="app/build/outputs/apk/release/OpenTouch-v${{ steps.app_version.outputs.version_name }}.apk"
          LATEST_APK="app/build/outputs/apk/release/OpenTouch-latest.apk"
          cp "$APK_PATH" "$VERSIONED_APK"
          cp "$APK_PATH" "$LATEST_APK"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/OpenTouch-v*.apk
            app/build/outputs/apk/release/OpenTouch-latest.apk
          generate_release_notes: true
