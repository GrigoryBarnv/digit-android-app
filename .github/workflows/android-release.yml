name: Android Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.10.2.4988404"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Read app version
        id: app_version
        run: |
          VERSION_NAME=$(./gradlew -q :app:printVersionName --console=plain | tail -n 1 | tr -d '\r')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Rename APKs with version
        run: |
          mkdir -p app/build/outputs/apk/release
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "OpenTouch-*" | head -n 1)
          if [ -z "$DEBUG_APK" ]; then
            echo "Debug APK not found"
            find app/build/outputs -name "*.apk" -o -name "*.aab" | sort
            exit 1
          fi
          cp "$DEBUG_APK" "app/build/outputs/apk/release/OpenTouch-v${{ steps.app_version.outputs.version_name }}-debug.apk"
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "app/build/outputs/apk/release/OpenTouch-v${{ steps.app_version.outputs.version_name }}.apk"
            cp "$RELEASE_APK" "app/build/outputs/apk/release/OpenTouch-latest.apk"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/OpenTouch-v*.apk
            app/build/outputs/apk/release/OpenTouch-latest.apk
          generate_release_notes: true
